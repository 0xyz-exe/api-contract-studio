[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-studio"
version = "0.1.0"
description = "Open-Source API Contract Testing & Breaking Change Detection Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "API Contract Studio Contributors" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
acs = "api_contract_studio.cli:main"
api-contract-studio = "api_contract_studio.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "src", "apps/api"]
testpaths = ["tests"]
