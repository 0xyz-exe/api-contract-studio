version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: acs-postgres
    restart: always
    environment:
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: acs_password
      POSTGRES_DB: contract_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: acs-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://acs:acs_password@db:5432/contract_studio
      SECRET_KEY: dev-insecure-secret-key-change-in-production-32bytes-min
    depends_on:
      - db

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: acs-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata:
